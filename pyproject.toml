[project]
name = "radiografia"
version = "0.1.0"
description = "Informative look-through analysis of retail ETF portfolios (UCITS, EUR). Not investment advice."
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are added when the step that needs them starts.
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pydantic>=2.7",
    "streamlit>=1.39",
    "plotly>=5.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "validation: compares results against issuer-published data; needs real snapshots (not in git)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PD", "NPY", "RUF"]
# Multiplication and minus signs are intended in Spanish user-facing formulas.
allowed-confusables = ["×", "−"]
